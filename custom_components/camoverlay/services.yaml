fullscreen:
  name: Fullscreen
  description: Show one or more cameras fullscreen on a device.
  fields:
    device:
      name: Device
      description: Device name (e.g. tv, phone).
      required: true
      example: tv
      selector:
        text:
    cameras:
      name: Cameras
      description: >-
        Up to 4 camera source names (resolved via the go2rtc URL in the
        integration options) or full frame URLs. With more than one camera they
        are tiled in a grid. Leave empty to use the device's own configured camera.
      required: false
      example: "[entrance, yard]"
      selector:
        object:

stop:
  name: Stop
  description: Hide the overlay / close fullscreen on a device.
  fields:
    device:
      name: Device
      description: Device name (e.g. tv, phone).
      required: true
      example: tv
      selector:
        text:

pip:
  name: Picture-in-picture
  description: Show the camera as a floating window on a device.
  fields:
    device:
      name: Device
      description: Device name (e.g. tv, phone).
      required: true
      example: tv
      selector:
        text:
    size:
      name: Size
      description: "quarter = 1/2 of screen width, small = 1/4 of screen width."
      required: false
      default: quarter
      selector:
        select:
          options:
            - quarter
            - small
    corner:
      name: Corner
      description: Which corner to dock the window in.
      required: false
      default: br
      selector:
        select:
          options:
            - tl
            - tr
            - bl
            - br
    cameras:
      name: Cameras
      description: >-
        Up to 4 camera source names (resolved via the go2rtc URL in the
        integration options) or full frame URLs. With more than one camera they
        are tiled in a grid inside the PiP window. Leave empty to use the
        device's own configured camera.
      required: false
      example: "[entrance, yard, gate, garage]"
      selector:
        object:
